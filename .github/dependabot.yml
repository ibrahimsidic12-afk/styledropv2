version: 2

updates:
  # ----------------------------------------------------------- Gradle deps
  - package-ecosystem: "gradle"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Manila"
    open-pull-requests-limit: 8
    versioning-strategy: increase
    labels:
      - "dependencies"
      - "gradle"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"
    # AGP / Kotlin / KSP / Gradle must move in lockstep and are release-checked manually.
    ignore:
      - dependency-name: "com.android.application"
      - dependency-name: "com.android.tools.build:gradle"
      - dependency-name: "org.jetbrains.kotlin:*"
      - dependency-name: "com.google.devtools.ksp:*"
      - dependency-name: "org.jetbrains.kotlin.plugin.compose"
    groups:
      androidx:
        patterns:
          - "androidx.*"
      compose:
        patterns:
          - "androidx.compose*"
      room:
        patterns:
          - "androidx.room*"
      firebase:
        patterns:
          - "com.google.firebase*"
      testing:
        patterns:
          - "org.robolectric*"
          - "io.github.takahirom.roborazzi*"
          - "junit*"
          - "org.jetbrains.kotlinx:kotlinx-coroutines-test*"
      static-analysis:
        patterns:
          - "org.jlleitschuh.gradle.ktlint*"
          - "io.gitlab.arturbosch.detekt*"

  # --------------------------------------------------------- GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Manila"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"

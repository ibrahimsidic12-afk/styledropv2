name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dkotlin.daemon.jvm.options=-Xmx2g"
  # Stub key so BuildConfig compiles; real AI calls are never made in CI.
  GEMINI_API_KEY: "CI_PLACEHOLDER_KEY_NOT_USED"

jobs:
  # ---------------------------------------------------------------- static
  static-analysis:
    name: Lint / ktlint / detekt
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: ktlint
        run: ./gradlew ktlintCheck --stacktrace
      - name: detekt
        run: ./gradlew detekt --stacktrace
      - name: Android Lint
        run: ./gradlew :app:lintDebug --stacktrace
      - name: Upload static-analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-reports
          path: |
            app/build/reports/ktlint/**
            app/build/reports/detekt/**
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
          if-no-files-found: warn

  # ----------------------------------------------------------------- build
  build:
    name: Assemble debug
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # ------------------------------------------------------------- unit test
  unit-test:
    name: Unit tests + coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: JaCoCo report
        if: always()
        run: ./gradlew :app:jacocoTestReport --stacktrace
      - name: Coverage gate (>= 30% line)
        run: ./gradlew :app:jacocoTestCoverageVerification --stacktrace
      - name: Unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            app/build/reports/tests/testDebugUnitTest/**
            app/build/test-results/testDebugUnitTest/**
          if-no-files-found: warn
      - name: JaCoCo reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: app/build/reports/jacoco/**
          if-no-files-found: warn
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          files: app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
          flags: unittests
          name: styledrop-unit
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload coverage to Coveralls
        if: always()
        uses: coverallsapp/github-action@v2
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
          format: jacoco
          fail-on-error: false

  # ------------------------------------------------------------ screenshot
  screenshot-test:
    name: Roborazzi screenshot diff
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify screenshots against committed goldens
        # Golden PNGs must be committed under app/src/test/screenshots/.
        # Regenerate with: ./gradlew recordRoborazziDebug
        run: ./gradlew :app:verifyRoborazziDebug --stacktrace
      - name: Upload screenshot diff output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-diff
          path: |
            app/build/outputs/roborazzi/**
            app/build/reports/roborazzi/**
          if-no-files-found: warn

  # --------------------------------------------------- instrumentation (opt)
  instrumentation:
    name: Connected tests (API 34)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: build
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run connected tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumented-test-results
          path: app/build/reports/androidTests/**
          if-no-files-found: warn

  # -------------------------------------------------- aggregate status gate
  ci-status:
    name: CI status
    runs-on: ubuntu-latest
    needs: [ static-analysis, build, unit-test, screenshot-test ]
    if: always()
    steps:
      - name: Fail if any required job failed
        run: |
          for r in \
            "${{ needs.static-analysis.result }}" \
            "${{ needs.build.result }}" \
            "${{ needs.unit-test.result }}" \
            "${{ needs.screenshot-test.result }}"; do
            if [ "$r" != "success" ]; then
              echo "A required job did not succeed: $r"
              exit 1
            fi
          done
          echo "All required jobs succeeded."
